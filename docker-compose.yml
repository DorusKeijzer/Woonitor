
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file: .env
    profiles: ["backend"]

  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    profiles: ["backend", "dashboard", "ml"]

  scraper:
    build:
      context: .
      dockerfile: scraper.dockerfile
    env_file: .env
    # The new, working command for the scraper service
    # command: ["bash", "-c", "Xvfb :99 -screen 0 1024x768x24 & export DISPLAY=:99 && /app/.venv/bin/python scrapers/scraper.py"]
    command: ["bash", "-c", "Xvfb :99 -screen 0 1024x768x24 & export DISPLAY=:99 && python scrapers/scraper.py"]
    # command: ["bash", "-c", "Xvfb :99 -screen 0 1024x768x24 & export DISPLAY=:99 && python scrapers/scraper.py"]
    profiles: ["scraper"]

  crawler:
      build:
        context: .
        dockerfile: scraper.dockerfile
      env_file: .env
      command: ["bash", "-c", "Xvfb :99 -screen 0 1024x768x24 & export DISPLAY=:99 && python scrapers/crawler.py"]
      profiles: ["crawler"]

  writer:
    build:
      context: .
      dockerfile: writer.dockerfile
    env_file: .env
    command: ["python", "scrapers/writer.py"]
    profiles: ["writer"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    env_file: .env
    profiles: ["backend"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      # Bound to localhost only: this instance was publicly exposed on 3000 for
      # 13 months and got repeatedly compromised via its API (rogue admin
      # service accounts + dozens of probe datasources scanning the internal
      # network). Reach it via `ssh -L 3000:localhost:3000 <host>` instead.
      - "127.0.0.1:3000:3000"
    env_file: .env
    profiles: ["backend"]
    depends_on:
      - prometheus

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    profiles: ["backend"]
    depends_on:
      - postgres

  redis_exporter:
    image: oliver006/redis_exporter
    environment:
      # Previously unset entirely, so this exporter never actually connected
      # to Redis (redis_up was permanently 0) - Prometheus only ever saw that
      # the exporter process itself was reachable, not real Redis stats.
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      # Exposes redis_key_size{key="..."} for the pipeline's queues so their
      # depth (list length / set cardinality) can be graphed in Grafana.
      REDIS_EXPORTER_CHECK_KEYS: "listing_queue,data_queue,listing_queue_dead,listing_seen"
    ports:
      - "9121:9121"
    profiles: ["backend"]
    depends_on:
      - redis

  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    profiles: ["backend"]

  streamlit:
    build:
      context: .
      dockerfile: frontend.dockerfile
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - postgres
    profiles: ["dashboard"]

  ml_services:
    build:
      context: .
      dockerfile: ml.dockerfile
    env_file: .env
    depends_on:
      - postgres
    profiles: ["ml"]

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
